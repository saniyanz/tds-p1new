[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tds-automation-agent"
version = "1.0.0"
description = "LLM-powered automation agent (TDS Project 1), refactored to engineering standards."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.13.3",
    "Faker==35.2.0",
    "Flask==2.3.1",
    "google-cloud-speech==2.30.0",
    "googletrans==4.0.2",
    "langdetect==1.0.9",
    "Markdown==3.7",
    "numpy==1.26.4",
    "openai==1.61.1",
    "pillow==11.1.0",
    "pydantic==2.10.4",
    "pydub==0.25.1",
    "pytesseract==0.3.13",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.0.0",
    "requests==2.32.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-mock==3.14.0",
    "ruff==0.8.4",
    "black==24.10.0",
    "mypy==1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app.py", "core", "agent", "operations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "integration: tests that call the real LLM / network",
]
filterwarnings = ["ignore::DeprecationWarning"]
